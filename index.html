<!doctype html>
<html lang="en" dir="rtl">
<!--  -->




<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../images/logo w 1 (1).svg" />
  <link rel="stylesheet" href="/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sanaa2</title>
  <style>
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 100vh;
      z-index: 9999;
      overflow: hidden;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splashFade 2.5s ease-out forwards;
    }

    #splash img {
      width: 300px;
      opacity: 0;
      animation: splashLogo 2s ease-out forwards;
    }

    /* 0-1.5s: أبيض فاضي / 1.5-2s: الشعار بينزل من فوق بنعومة (نص ثانية) / 2-4s: ثابت / 4-4.5s: يختفي مع الخلفية (نص ثانية) */
    @keyframes splashLogo {

      0%,
      33.33% {
        opacity: 0;
        transform: translateY(-48px) scale(0.85);
      }

      44.44%,
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes splashFade {

      0%,
      88.89% {
        opacity: 1;
        visibility: visible;
      }

      100% {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }
  </style>
</head>

<body>
  <div id="splash">
    <img src="/images/logo w 1.svg" alt="صنعة" />
  </div>
  <div id="root"></div>
  <script type="module" src="src/main.jsx"></script>
</body>

</html>
