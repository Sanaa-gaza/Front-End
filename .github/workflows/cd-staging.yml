name: CD - Staging

# بيشتغل تلقائي مع كل push على فرع develop (فرع التطوير/التجريب)،
# وبينشر آخر نسخة على GitHub Pages كبيئة staging عشان تتراجع قبل
# ما تروح للفرع الرئيسي main.
#
# ملاحظة: لازم تفعّلي GitHub Pages مرة واحدة من إعدادات المستودع
# (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [develop]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-staging"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
